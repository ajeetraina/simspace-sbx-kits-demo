<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Authority as Code — the Sandbox Kit Spec</title>
<meta name="description" content="A 40-minute tour of Docker Sandbox Kit v3: containment over containers, a Kit as one OCI image, and authority as code." />
<style>
  :root { --ink: #0B1533; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
  body { font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #slide {
    max-width: 100%; max-height: 100%;
    width: auto; height: auto;
    aspect-ratio: 16 / 9;
    object-fit: contain;
    user-select: none; -webkit-user-drag: none;
  }
  /* Nav zones */
  .zone {
    position: absolute; top: 0; bottom: 0; width: 33%;
    cursor: pointer; z-index: 5;
  }
  .zone.left  { left: 0; }
  .zone.right { right: 0; }
  /* HUD */
  #hud {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; align-items: center; gap: 14px;
    color: #cdd7f5; background: rgba(11,21,51,.55);
    padding: 7px 14px; border-radius: 999px;
    backdrop-filter: blur(6px); opacity: 0; transition: opacity .25s;
  }
  body:hover #hud { opacity: 1; }
  #hud button {
    all: unset; cursor: pointer; color: #fff; font-size: 16px;
    padding: 2px 8px; border-radius: 6px;
  }
  #hud button:hover { background: rgba(255,255,255,.12); }
  #counter { font-variant-numeric: tabular-nums; min-width: 52px; text-align: center; }
</style>
</head>
<body>
  <div id="stage">
    <img id="slide" alt="" decoding="async" />
  </div>
  <div class="zone left"  id="prevZone" aria-label="Previous slide"></div>
  <div class="zone right" id="nextZone" aria-label="Next slide"></div>

  <div id="hud">
    <button id="prev" title="Previous (←)">◀</button>
    <span id="counter">1 / 27</span>
    <button id="next" title="Next (→)">▶</button>
    <button id="full" title="Fullscreen (F)">⤢</button>
  </div>

<script>
  var TOTAL = 27;
  var pad = function (n) { return (n < 10 ? "0" : "") + n; };
  var src = function (n) { return "assets/slide-" + pad(n) + ".webp"; };

  var img = document.getElementById("slide");
  var counter = document.getElementById("counter");

  // Start from #hash (e.g. #7) if present, else slide 1.
  var i = Math.min(Math.max(parseInt(location.hash.slice(1), 10) || 1, 1), TOTAL);

  function render() {
    img.src = src(i);
    counter.textContent = i + " / " + TOTAL;
    if (("" + i) !== location.hash.slice(1)) {
      history.replaceState(null, "", "#" + i);
    }
    // Preload the next slide.
    if (i < TOTAL) { new Image().src = src(i + 1); }
  }
  function go(n) { i = Math.min(Math.max(n, 1), TOTAL); render(); }
  function next() { if (i < TOTAL) go(i + 1); }
  function prev() { if (i > 1) go(i - 1); }

  document.getElementById("next").onclick = next;
  document.getElementById("prev").onclick = prev;
  document.getElementById("nextZone").onclick = next;
  document.getElementById("prevZone").onclick = prev;
  document.getElementById("full").onclick = function () {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else { document.documentElement.requestFullscreen(); }
  };

  document.addEventListener("keydown", function (e) {
    switch (e.key) {
      case "ArrowRight": case "PageDown": case " ": next(); e.preventDefault(); break;
      case "ArrowLeft":  case "PageUp": prev(); e.preventDefault(); break;
      case "Home": go(1); break;
      case "End": go(TOTAL); break;
      case "f": case "F": document.getElementById("full").click(); break;
    }
  });

  window.addEventListener("hashchange", function () {
    var n = parseInt(location.hash.slice(1), 10);
    if (n && n !== i) go(n);
  });

  render();
</script>
</body>
</html>
